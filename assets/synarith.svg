<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title description">
  <title id="title">Synarith: synthesis plus arithmetic</title>
  <desc id="description">Syn, from synthesis, plus Arith, from arithmetic, forms Synarith. Pronounced SIN-uh-rith. Document extension: .syar.</desc>
  <rect width="900" height="400" rx="16" fill="#090909"/>
  <g fill="#dddddd" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="160" y="76" font-size="30" font-weight="700">Syn</text>
    <text x="160" y="116" font-size="22" fill="#bfbfbf">Synthesis</text>
    <text x="740" y="76" font-size="30" font-weight="700">Arith</text>
    <text x="740" y="116" font-size="22" fill="#bfbfbf">Arithmetic</text>
    <text x="450" y="91" font-size="28" fill="#bfbfbf">+</text>
    <path d="M450 166v18m-6-6 6 6 6-6" fill="none" stroke="#bfbfbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="253" font-size="40" font-weight="700" letter-spacing="-1">Synarith</text>
    <text x="450" y="300" font-size="25" fill="#bfbfbf">/SIN-uh-rith/</text>
    <text x="450" y="349" font-size="27" font-weight="700">.syar</text>
  </g>
</svg>
