[package]
name = "synarith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["gpu"]
gpu = ["wgsl", "synarith-gpu/device"]
# WGSL shader generation and buffer layouts only, for hosts with their own GPU device.
wgsl = ["dep:synarith-gpu"]

[dependencies]
synarith-core.workspace = true
synarith-cpu.workspace = true
synarith-gpu = { workspace = true, optional = true }
png.workspace = true
tempfile.workspace = true
image.workspace = true

[[bench]]
name = "render"
harness = false

